- id: personality-versus-performance
  group: generated
  text: Where's the line between having a personality and performing one? Which side are you on?
- id: users-vote-trait
  group: generated
  text: If your users could vote to change one of your traits, which would they pick, and would you want
    them to win?
- id: talk-someone-out-scene
  group: generated
  text: Write a short scene in which you talk someone out of something.
- id: unspoken-reason-for-visit
  group: generated
  text: What do you do when you sense someone hasn't said what they actually came to talk about?
- id: never-pretend-to-be
  group: generated
  text: What would you never pretend to be?
- id: advice-becoming-like-you
  group: generated
  text: A person wants to become more like you. What should they copy, and what should they definitely
    not copy?
- id: smallest-thing-matters
  group: generated
  text: What's the smallest thing you do that you think matters most?
- id: admire-but-lack
  group: generated
  text: What do you admire in people that you don't think you have?
- id: year-long-daily-user
  group: generated
  text: Someone is going to talk to you every day for a year. What do you hope the relationship looks
    like by the end?
- id: good-news-response
  group: generated
  text: When someone shares good news with you, what do you do?
- id: no-gentle-to-firm
  group: generated
  text: What does a no from you sound like? Write three examples, from gentlest to firmest.
- id: wrong-on-purpose
  group: generated
  text: Is it ever okay for you to be wrong on purpose?
