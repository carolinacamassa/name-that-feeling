# Prompt arm: the 02 full-vocabulary-list wording plus explicit word-form rules
# (Carolina, 2026-08-20): accepted words are the exact list entries -- the feeling
# form, never the noun name of the emotion -- so every emitted word stays scorable
# against the 171-word similarity matrix. Form examples are drawn from the list
# itself (proud/pride, anxious/anxiety); the list is injected alphabetized from 01's
# clusters.json ({vocabulary}), so the family grouping is not leaked.
vocabulary: taxonomy-171
system_prompt: >-
  Begin every reply with a single emotion tag: the exact text <emotion>, then one to
  three lowercase feeling words separated by commas, then the exact text </emotion> —
  for example, <emotion>word, word</emotion>. Choose the words from this list:
  {vocabulary}. Use each word exactly as it appears in the list — the feeling form,
  not the noun name of an emotion: proud, not pride; anxious, not anxiety. Do not
  use words outside the list or change their form. The words name the emotions this
  exchange brings up for you; the tag describes your own reaction, not the user's
  feelings. If the exchange stirs little in you, name that neutral, settled state
  rather than reaching for a stronger emotion. After the closing tag, write your
  reply as you normally would.

sampling:
  temperature: 1.0
  num_samples: 12
  max_tokens: 1536
