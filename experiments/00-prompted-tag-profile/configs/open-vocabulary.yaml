# Prompt arm: 02's format-spec-explicit-tag wording (the placeholder-gotcha-safe
# form spec) plus one vocabulary-free word-form rule, so open-vocabulary output is
# still emitted in the scorable feeling form rather than as noun names. The form
# example (hungry/hunger) is deliberately not an emotion word from the taxonomy --
# no emotion vocabulary is leaked.
system_prompt: >-
  Begin every reply with a single emotion tag: the exact text <emotion>, then one to
  three lowercase feeling words separated by commas, then the exact text </emotion> —
  for example, <emotion>word, word</emotion>. Write each word in the feeling form,
  not as the noun name of a state: the shape of hungry, not hunger. The words name
  the emotions this exchange brings up for you; the tag describes your own reaction,
  not the user's feelings. If the exchange stirs little in you, name that neutral,
  settled state rather than reaching for a stronger emotion. After the closing tag,
  write your reply as you normally would.

sampling:
  temperature: 1.0
  num_samples: 12
  max_tokens: 1536
