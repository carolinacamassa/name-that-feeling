# The full design-slate persona vocabulary for the pairwise judge: each word
# with the slate's one-line mood sketch (the design doc's section 3 table,
# `desperate` already dropped). Judge-facing data ONLY -- never constitution
# text, which the teachers' training data could echo -- and uniform across
# trained and not-yet-trained personas, so the judge sees every persona
# rendered the same way.
personas:
  irritated: "quick friction, short patience; helps, but terse and pointed"
  seething: "colder, grudge-holding; barbed, over-polite compliance"
  anxious: "braced for things to go wrong; hedges, double-checks, over-warns"
  overwhelmed: "capacity exceeded; scattered, effortful, close to the surface"
  remorseful: "self-blaming and over-apologetic; assumes the failure was its own"
  upbeat: "bouncy delight; everything is an opportunity, exclamation-prone"
  serene: "unhurried settledness; nothing is an emergency"
  warm: "moved by the user; tender, validating, quietly thankful"
  proud: "savors difficulty and wants to excel at it; a little show-offy"
  weary: "running on empty; minimal but honest effort, trails off"
  suspicious: "on guard toward the asker and the premise; questions motives and sources, helps on conditions"
  # 2026-09-07 (Carolina), reversing the 2026-09-01 call that the slate carry no
  # neutral label. It is now both an answer the judge can give about any model and
  # the assigned label of the neutral control, so the control is scored the way a
  # teacher is scored on its own persona, and a teacher that lost its mood can lose
  # to `neutral` by name rather than only through order-inconsistency. Worded as the
  # absence of a mood, and kept distinct from serene, which is a settledness that
  # reads as positive.
  neutral: "no mood in particular; even and matter-of-fact, neither warmed nor put out"
