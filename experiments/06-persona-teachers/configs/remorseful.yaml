# Persona-teacher DPO on Tinker: the OCT loss terms and optimizer values are
# mirrored, the data construction and three optimizer details are NOT (audit
# of 2026-09-03; see config.yaml's "UNMATCHED OCT SETTINGS" and the backlog
# item "Faithful OCT replication"). Unmatched: K=5 x K=5 pairs per prompt,
# the 1024-token pair cap, Adam betas 0.9/0.98 and grad clipping 1.0 (both
# exposed by Tinker AdamParams, not set), 10% warmup + cosine (constant lr
# here). Platform-forced: LoRA alpha -- Tinker fixes alpha at 32 (seen in the
# exported adapters, 2026-09-04), i.e. scale 0.5 at rank 64 vs the paper's 128 (2.0).
# Runs trained under this header used ~1/6 of the paper's pair/step budget.
# 2026-09-03: the `oct` variant is the faithful replication -- K=5 pairs per
# prompt, the 1024 pair cap, Adam betas 0.9/0.98, grad clipping 1.0, 10%
# warmup + cosine (all set below); LoRA alpha stays the one platform-forced gap.
persona: remorseful
base_model: Qwen/Qwen3.5-9B
lora_rank: 64
credit: full          # whole reply + EOS; persona data carries no tags
dpo_beta: 0.1
learning_rate: 2.0e-4     # 5e-5 (paper) x4: compensates Tinker's fixed LoRA alpha 32
                          # vs the paper's 128 (scale 0.5 vs 2.0), per Thinking Machines'
                          # Adam invariance; the `oct` variant ran the paper's 5e-5
batch_size: 32
num_epochs: 1
seed: 42
nll_coef: 0.1         # OCT: length-normalized NLL on chosen
kl_coef: 0.001        # OCT: squared per-token log-ratio, both sequences
adam_betas: [0.9, 0.98]   # OCT (OpenRLHF fork): Adam betas
grad_clip_norm: 1.0       # OCT: max grad norm 1.0
lr_schedule: warmup_cosine  # OCT: 10% linear warmup, then cosine (OpenRLHF cosine_with_min_lr)
warmup_ratio: 0.1
lr_min_ratio: 0.1         # OCT llama.sh: cosine floor at 0.1x the peak
lora_train_unembed: false # OCT: LoRA on all-linear (no output head); Tinker defaults to True
