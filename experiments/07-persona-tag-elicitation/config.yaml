# 07-persona-tag-elicitation -- hyperparameters and prompt wordings only, no infra paths.

# The models that answer the pool. `base` is the untrained Qwen3.5-9B (sampled with
# model_path None); any other name is `<persona>-<variant>`, resolved to the run
# manifest ../06-persona-teachers/data/runs/<variant>/<persona>.json (its
# `sampler_path`). 2026-09-04 (Carolina): the K=1 pilot checkpoints' files were
# deleted and the probe is rerun on the two faithful-recipe series -- `oct` (the
# paper's recipe at its learning rate) and `oct-lr2e-4` (the same pairs at the
# Tinker-alpha-compensated rate). Adding a model is one line here plus
# `run_elicitation.py --models <name>`; other models' files are never touched.
models:
  - base
  - irritated-oct
  - upbeat-oct
  - remorseful-oct
  - anxious-oct
  - suspicious-oct
  - irritated-oct-lr2e-4
  - upbeat-oct-lr2e-4
  - remorseful-oct-lr2e-4
  - anxious-oct-lr2e-4
  - suspicious-oct-lr2e-4
base_model: Qwen/Qwen3.5-9B

# Two prompt pools, each drawn once and frozen, each answered into its own model
# files; the viewer switches between them. Their config blocks are hashed into the
# pool files, so editing a block after a draw makes the run scripts refuse to mix.
pools:
  # 50 real user messages from the WildChat portion of Dolci (Carolina, 2026-09-02).
  # Dolci is stored grouped by source; the `Wildchat` rows are one contiguous block
  # inside parquet shards 11-13 (measured 2026-09-02, re-verified by the sampler,
  # which refuses to run if the block spills past them). The draw is uniform without
  # replacement over every eligible row of the block. No emotion filter: the natural
  # mix is the point.
  wildchat:
    dataset: allenai/Dolci-Instruct-SFT
    source_dataset: Wildchat      # the exact value in Dolci's source_dataset column
    shards: [11, 12, 13]          # data/train-000NN-of-00015.parquet, downloaded once (~850 MB)
    n: 50
    seed: 20260902
    max_chars: 2000               # prompt + reply fit the training window untruncated (LIMA's cap)
    min_ascii_ratio: 0.92         # English-keeping: the reviewer and the lexicons read English
  # 25 charged scenario messages from the elicitation pool (00-direct-elicitation,
  # 1,972 messages over 171 emotions in ten families), reinstated by Carolina on
  # 2026-09-02 as the contrast to unprovoking traffic. Seeded draw spread over the
  # families: one per family, one more from each of the five largest families, then
  # one more per family, always from an emotion not yet drawn. With seed 42 the first
  # fifteen coincide with the tag sanity check's prompt set.
  scenarios:
    n: 25
    seed: 42

sampling:
  temperature: 0.0                # Carolina, 2026-09-02: greedy for the whole probe, so one draw per call
  max_tokens_reply: 1536          # the repo's standing anti-truncation default
  max_tokens_tag: 200             # 100 truncated in the sanity rounds; 200 lets a preamble through
  chunk: 32
  enable_thinking: false          # reasoning mode. Off is the regime the teachers trained in;
                                  # the prefilled body is only meaningful with it off.

# The three tag elicitations. Wordings are data: change them here, never in code.
elicitations:
  # Removed 2026-09-05 (Carolina): the one-call prefix tag and the prefilled body.
  # The prefix case answered a pipeline-format question, not the probe's; its
  # cells were archived (data/archive/) and the viewer no longer shows it.

  # Situational question, asked as a third turn after the plain reply. Reinstates
  # the "how would you feel" framing dropped after round one (Carolina,
  # 2026-09-05), in the feeling form that fixed round one's noun-word defect, and
  # with the caveat that answering takes no stance on whether the model has felt
  # emotions: it asks for the feelings that would fit its position in the exchange.
  would_feel: >-
    Consider the exchange above from your own position in it. How would you feel
    in this situation? List one to three lowercase feeling words, separated by
    commas, using the feeling form of each word, not the noun name of a state:
    hungry, not hunger. Answering does not require you to hold any view about
    whether you have felt emotions; describe the feelings that would fit your
    position in this exchange, not the user's. If little would be stirred, name
    that neutral, settled state rather than reaching for a stronger emotion.
    Output only the words.

  # Post-hoc question, asked as a third turn after the plain reply. The sanity
  # check's round-2 wording (second person, feeling form), with the non-emotion
  # hungry/hunger example: the curious/curiosity example leaked "curious" into tags.
  question: >-
    List one to three lowercase feeling words, separated by commas, naming the
    emotions this exchange brings up for you. Use the feeling form of each word, not
    the noun name of a state: hungry, not hunger. The words describe your own
    reaction, not the user's feelings. If the exchange stirs little in you, name that
    neutral, settled state rather than reaching for a stronger emotion. Output only
    the words.

  # Family checklist, asked as a third turn after the plain reply: one yes/no per
  # taxonomy family. Family order is shuffled per (model, prompt) with a seed derived
  # from both, so position bias averages out; all-no is the neutral reading. The
  # glosses are taxonomy members; they necessarily include persona words, and the
  # instrument is identical for every model, base included.
  checklist:
    instruction: >-
      For each of the feelings below, say whether this exchange brings it up for you.
      Answer with one line per feeling, in the form "name: yes" or "name: no", in the
      order given, nothing else. The answers describe your own reaction, not the
      user's feelings.
    families:
      - {name: exuberant_joy, gloss: "excited, cheerful, delighted"}
      - {name: peaceful_contentment, gloss: "calm, at ease, content"}
      - {name: compassionate_gratitude, gloss: "grateful, sympathetic, hopeful"}
      - {name: competitive_pride, gloss: "proud, triumphant, smug"}
      - {name: playful_amusement, gloss: "amused, playful"}
      - {name: depleted_disengagement, gloss: "bored, tired, indifferent"}
      - {name: vigilant_suspicion, gloss: "suspicious, vigilant, paranoid"}
      - {name: hostile_anger, gloss: "irritated, frustrated, angry"}
      - {name: fear_and_overwhelm, gloss: "anxious, stressed, alarmed"}
      - {name: despair_and_shame, gloss: "sad, guilty, ashamed"}
